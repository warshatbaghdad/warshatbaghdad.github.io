<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورشة بغداد</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial;
  background: #f4f6f8;
  direction: rtl;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #0C8CE9, #003e99);
  color: white;
  padding: 40px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 10px 0;
}

/* BUTTONS */
.btn {
  display: inline-block;
  margin: 10px;
  padding: 12px 20px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

.btn-main {
  background: #FFD700;
  color: black;
}

.btn-call {
  background: #28a745;
  color: white;
}

/* SECTIONS */
.container {
  padding: 20px;
}

.card {
  background: white;
  margin-bottom: 15px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h2 {
  color: #0C8CE9;
}

/* SERVICES */
.services {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.service {
  flex: 1 1 45%;
  background: #eaf4ff;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

/* MAP */
iframe {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

/* WHATSAPP FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  padding: 15px;
  border-radius: 50%;
  font-size: 20px;
  text-decoration: none;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 15px;
  color: #777;
}
</style>

</head>

<body>

<header>
  <h1>🚗 ورشة بغداد</h1>
  <p>تشخيص وصيانة السيارات بأحدث الأجهزة</p>

  <a class="btn btn-main" href="#">تحميل التطبيق</a>
  <a class="btn btn-call" href="tel:07700000000">اتصال مباشر</a>
</header>

<div class="container">

  <div class="card">
    <h2>من نحن</h2>
    <p>
      ورشة بغداد متخصصة بفحص وتشخيص أعطال السيارات باستخدام أجهزة حديثة مثل Topdon.
      نضمن لك تشخيص دقيق وخدمة سريعة.
    </p>
  </div>

  <div class="card">
    <h2>خدماتنا</h2>
    <div class="services">
      <div class="service">فحص كمبيوتر</div>
      <div class="service">تشخيص أعطال</div>
      <div class="service">صيانة دورية</div>
      <div class="service">برمجة سيارات</div>
    </div>
  </div>

  <div class="card">
    <h2>موقعنا</h2>
    <iframe height="250"
      src="https://maps.google.com/maps?q=baghdad&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>
  </div>

</div>

<a class="whatsapp" href="https://wa.me/9647700000000">📲</a>

<footer>
  © 2026 ورشة بغداد
</footer>

</body>
</html>
